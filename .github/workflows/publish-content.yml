name: publish-content-dual
run-name: Human-merged content → Pages and CN
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      readiness_only:
        description: Read-only credentials and paired archive integration test; no publication
        type: boolean
        default: false
      retry:
        description: Retry current main only after inspecting a failed or cancelled attempt
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: blog-pages-preview
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && !inputs.readiness_only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      deployments: write
    outputs:
      eligible: ${{ steps.inspect.outputs.eligible }}
      sourceCommit: ${{ steps.inspect.outputs.sourceCommit }}
      cnRun: ${{ steps.inspect.outputs.cnRun }}
      comRun: ${{ steps.inspect.outputs.comRun }}
      cnHash: ${{ steps.inspect.outputs.cnHash }}
      comHash: ${{ steps.inspect.outputs.comHash }}
      ledgerId: ${{ steps.inspect.outputs.ledgerId }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - id: inspect
        run: node scripts/content-publish.mjs inspect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          RETRY: ${{ inputs.retry }}
  publish:
    needs: inspect
    if: needs.inspect.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: content-auto
    permissions:
      contents: read
      checks: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Recheck human merge, publish sealed pair, and issue CN handoff
        run: node scripts/content-publish.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          EXPECTED_SOURCE: ${{ needs.inspect.outputs.sourceCommit }}
          CN_RUN: ${{ needs.inspect.outputs.cnRun }}
          COM_RUN: ${{ needs.inspect.outputs.comRun }}
          CN_HASH: ${{ needs.inspect.outputs.cnHash }}
          COM_HASH: ${{ needs.inspect.outputs.comHash }}
          LEDGER_ID: ${{ needs.inspect.outputs.ledgerId }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_LIKES_API_TOKEN: ${{ secrets.CLOUDFLARE_LIKES_API_TOKEN }}
      - name: Preserve metadata only, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dual-publication
          path: .work/dual-publication.json
          if-no-files-found: warn
          retention-days: 90
      - name: Retain metadata-only remote acceptance diagnostics on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dual-http-diagnostics
          path: |
            .work/cn/release/verified-static.json
            .work/cn/release/verified-full.json
            .work/com/release/verified-static.json
            .work/com/release/verified-full.json
          if-no-files-found: ignore
          retention-days: 90
  readiness:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.readiness_only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: content-auto
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Read-only credential and sealed pair integration
        run: node scripts/content-readiness.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_LIKES_API_TOKEN: ${{ secrets.CLOUDFLARE_LIKES_API_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: content-readiness
          path: .work/content-readiness.json
          if-no-files-found: error
          retention-days: 90
