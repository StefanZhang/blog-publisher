name: check-controller
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Verify live branch protection with the actual read-only workflow token
        run: node scripts/protection.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - name: Install signed secret-encryption test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-nacl
      - run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install isolated Nginx test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx-core
      - name: Test anonymous HK receiver and recovery
        run: python3 -m unittest discover -s deploy/hk -p 'test_*.py'
      - name: Verify public synthetic routing with real Nginx
        run: >-
          python3 deploy/hk/nginx_fixture.py --synthetic
          --work "$RUNNER_TEMP/hk-nginx-fixture"
          --nginx /usr/sbin/nginx --port 18743
      - name: Validate pinned workflow syntax
        run: |
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
