name: Bootstrap content-auto credentials (one-time human approval)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-credential-bootstrap
  cancel-in-progress: false
jobs:
  encrypt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Check controller protection and exact CI
        run: |
          node scripts/protection.mjs
          node --input-type=module -e 'import {verifyControllerChecks} from "./scripts/protection.mjs"; await verifyControllerChecks(process.env.GH_TOKEN,process.env.GITHUB_REPOSITORY,process.env.GITHUB_SHA)'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install Ubuntu signed sealed-box implementation before loading credentials
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-nacl
      - name: Encrypt to pinned GitHub content-auto environment public key
        run: /usr/bin/python3 scripts/content-secrets.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_LIKES_API_TOKEN: ${{ secrets.CLOUDFLARE_LIKES_API_TOKEN }}
      - name: Export only GitHub-encrypted values for owner installation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: content-auto-encrypted-secrets
          path: .work/content-secrets.encrypted.json
          if-no-files-found: error
          retention-days: 1
