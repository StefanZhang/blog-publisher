server {
    listen 80;
    listen [::]:80;
    server_name stefanzhang.cn www.stefanzhang.cn;

    location ~ ^/\.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stefanzhang.cn www.stefanzhang.cn;

    ssl_certificate /etc/letsencrypt/live/stefanzhang.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stefanzhang.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/stefanzhang.cn/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/stefanzhang.cn.access.log;
    error_log /var/log/nginx/stefanzhang.cn.error.log warn;

    add_header Strict-Transport-Security "max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        alias /var/lib/static-node-monitor/ok;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /_pagefind/ {
        expires 5m;
        try_files $uri =404;
    }

    # Generated inline assets use content hashes; mirrored third-party assets
    # are pinned by upstream version/query, and cf-fonts paths include a font
    # version. These namespaces can therefore use a one-year cache lifetime.
    location ^~ /_static/ {
        expires 1y;
        try_files $uri =404;
    }

    location ^~ /_mirror/ {
        expires 1y;
        try_files $uri =404;
    }

    location ^~ /cf-fonts/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        limit_except GET { deny all; }
        expires -1;
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
